# 字段识别规则配置（新增关键词直接改这里，不改代码）

# 颜色归并：统一归到白、灰两大类
color:
  # 名称中包含以下字的归到对应色系
  white_keywords: ["白", "雪", "玉", "奶", "米白"]
  gray_keywords: ["灰", "黛", "银", "砂", "钛", "墨"]
  # 明确的颜色名到色系的直接映射，优先级高于关键词
  name_map:
    流光白: "白"
    云隐白: "白"
    丝缎灰: "灰"
    流光黛: "灰"
    钛钢灰: "灰"
  # 无法明确归类的颜色，识别时标记人工复核
  pending: ["山海米", "烟青色", "云雾岩"]

# 价格识别
price:
  # 核心口径：主图只有一个价格、没按颜色分开标时，所有相关行直接填这个价，
  # 不做颜色对应；只有主图按颜色（或门型）标了多个价格时，才启用颜色归并和匹配。
  single_price_policy: "单一价格不区分颜色，直接填；多价格才按颜色门型对应"
  # 价格附近的引导词
  price_hints: ["到手价", "活动价", "到手", "活动到手", "价保", "抢", "仅需", "只要"]
  # 表明确认双色同价的写法
  same_price_hints: ["双色同价", "两色同价", "同价"]
  # 门型写法
  door_hints: ["十字", "法式", "对开", "三门"]
  # 价格数字：4 到 5 位
  price_number_pattern: '(\d{3,5})'
  # 连写价格：两个 4 位连在一起，如 43494349
  repeated_price_pattern: '(\d{4})(\d{4})'
  # 价格合理范围
  min_price: 300
  max_price: 99999

# 活动时间识别
time:
  # 时间附近的引导词，“活动时间”标签最可靠，优先找
  time_hints: ["活动时间", "日", "点", "开抢", "开抢", "截止", "限时", "到", "晚", "号"]
  # 完整范围（含月），如 10月30日20点-11月1日24点
  full_range_pattern: '(\d{1,2})月(\d{1,2})日(\d{1,2})点\s*[-到~]\s*(\d{1,2})月(\d{1,2})日(\d{1,2})点'
  # 省略月的范围，如 15日20点到16日24点
  range_pattern: '(\d{1,2})[日号](\d{1,2})点\s*[-到~]\s*(\d{1,2})[日号](\d{1,2})点'
  # 当天时段（钟点不带点），如 29日0-24点
  same_day_pattern: '(\d{1,2})[日号](\d{1,2})-(\d{1,2})点'
  # 当天时段（钟点带点），如 29日0点-24点
  same_day_hour_pattern: '(\d{1,2})[日号](\d{1,2})点\s*[-到~]\s*(\d{1,2})点'
  # 今日时段，如 今日0-24点
  today_pattern: '今日\s*(\d{1,2})[点]?\s*[-到~]\s*(\d{1,2})点'
  # 今日无钟点，如 今日下单购机
  today_date_pattern: '今日(下单|购机|开抢|抢购)'
  # 日期范围（无钟点），如 10.30日-11.3日
  date_only_pattern: '(\d{1,2})[.](\d{1,2})日?\s*[-到~]\s*(\d{1,2})[.](\d{1,2})日?'
  # 单个时点，如 30日20点开售
  single_pattern: '(\d{1,2})[日号](\d{1,2})点'
  # 带“晚”的时点，如 15日晚8点，换算成 24 小时
  evening_pattern: '(\d{1,2})[日号]晚(\d{1,2})点'
  range_word: "到"

# 权益四分层
benefit:
  # 纯引导语，整块主要是这些时跳过
  noise: ["咨询客服", "了解更多", "下拉详情", "更多优惠", "更多惊喜", "不烧心",
          "了解优惠", "立即抢购", "立即购", "到手价不高于", "焕新补贴到手"]
  # 赠品引导动作，含这些但没有具体赠品名时跳过
  gift_lead: ["下单赠", "加赠", "满赠", "秀图赠", "评论", "至高送", "预约",
              "首小时", "购机赠"]
  gift:
    label: "赠品"
    # 具体赠品名
    item_keywords: ["制冰机", "制冰舱", "皮肤贴", "汤锅", "锅具", "烤箱",
                    "咖啡机", "托特包", "文创大礼包"]
    # 动作词，需配合具体赠品
    action_keywords: ["赠品", "赠"]
  guarantee:
    label: "保障权益"
    keywords: ["整机延保", "整机保修", "压缩机包换", "压缩机十年包换", "十年包换",
               "以换代修", "一年保修", "价保", "买贵", "送货入户", "运费险",
               "质保", "延保", "保修", "包换", "包修"]
  redpacket:
    label: "红包"
    keywords: ["瓜分红包", "瓜分万元", "瓜分100万", "瓜分", "返红包", "晒单返现",
               "后返红包", "返50", "返100", "返200", "红包", "返现", "返"]
  other:
    label: "其他"
    keywords: ["政府补贴", "限时加补", "定金", "补贴", "免息", "跨品类套购",
               "套购", "85折", "97折", "95折", "折扣", "立减"]

# 页面验证弹窗检测：命中后自动暂停并提醒人工处理，不继续点击
captcha:
  # 验证弹窗特征文字，命中即判定，尽量只放验证弹窗里才会出现的强特征词
  keywords: ["安全验证", "滑块验证", "滑动验证", "人机验证", "拖动滑块",
             "请按住滑块", "完成下方验证", "完成验证", "向右滑动", "拼图验证",
             "请拖动", "拖动到最右边"]
  # 验证组件 iframe 的 url/name 特征，命中即判定，可靠性最高
  iframe_markers: ["baxia", "punish", "nocaptcha", "captcha", "aliyun",
                   "verify", "slider"]
  # 访问异常不属于验证弹窗，单独记录，避免误判
  risk_text: ["访问异常"]
