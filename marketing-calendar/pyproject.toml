[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marketing-calendar-tool"
version = "0.1.0"
description = "万相台营销场景报表下载与归档工具"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "playwright==1.63.0",
]

[project.scripts]
marketing-calendar = "marketing_calendar.cli:main"

[tool.setuptools.packages.find]
include = ["marketing_calendar*"]

